<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SS4;src:url(fonts/source-serif-4-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:SS4;src:url(fonts/source-serif-4-latin-400-italic.woff2);font-style:italic;font-weight:400}
:root{--ink:#111;--paper:#f6f3ec;--accent:#e4572e;--muted:#5f5a50}
*{margin:0;box-sizing:border-box}
body{font-feature-settings:"kern" 1,"liga" 1;text-rendering:optimizeLegibility;font-variant-numeric:lining-nums;width:var(--w);height:var(--h);background:var(--paper);color:var(--ink);font-family:SS4,serif;display:flex;flex-direction:column;padding:var(--pad);gap:var(--gap);overflow:hidden}
.sans{font-family:"Helvetica Neue",Arial,"DejaVu Sans",sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:var(--small);letter-spacing:.12em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:.6em}
.mark{font-family:SS4,serif;letter-spacing:0;background:var(--ink);color:var(--paper);width:2.4em;height:2.4em;display:flex;align-items:center;justify-content:center;font-size:1.05em;text-transform:none}
.mark i{font-style:normal;color:var(--accent)}
.top .stop{color:var(--accent)}
.top .issue{color:var(--muted);letter-spacing:.1em}
.main{flex:1;display:flex;flex-direction:column;justify-content:center}
.kicker{font-weight:700;font-size:var(--small);color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.7em}
h1{font-size:var(--big);line-height:1.04;font-weight:700;letter-spacing:-.015em}
h1 .dot{color:var(--accent)}
.sub{margin-top:.7em;font-size:var(--mid);color:var(--muted);font-style:italic;line-height:1.3}
.clears{border-top:4px dashed var(--ink);padding-top:var(--gap);display:flex;gap:.6em 1.5em;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;font-weight:700;font-size:var(--small)}
/* price tag: notched left edge + punched hole, slight hang */
.tag{position:relative;background:var(--accent);color:var(--paper);padding:.45em .9em .5em 2.1em;transform:rotate(-3deg);transform-origin:left center;
 clip-path:polygon(1.1em 0,100% 0,100% 100%,1.1em 100%,0 50%);display:flex;flex-direction:column;line-height:1}
.tag::before{content:"";position:absolute;left:.85em;top:50%;width:.55em;height:.55em;margin-top:-.275em;border-radius:50%;background:var(--paper)}
.tag small{font-size:.62em;letter-spacing:.16em;text-transform:uppercase;opacity:.9;margin-bottom:.35em}
.tag b{white-space:nowrap;font-size:1.75em;letter-spacing:-.01em}
.url{font-size:.9em;text-align:right;line-height:1.35;white-space:nowrap}
</style></head><body>
<div class="top sans"><span class="brand"><span class="mark">CP<i>.</i></span>Clearing Price</span><span class="issue" id="issue"></span></div>
<div class="main"><div class="kicker sans" id="kicker"></div><h1 id="call"></h1><div class="sub" id="sub"></div></div>
<div class="clears sans"><span class="tag"><small>Settles by</small><b id="date"></b></span><span class="url" id="by"></span></div>
<script>
const p=new URLSearchParams(location.search);const d=JSON.parse(p.get('d'));
for(const k of ['issue','kicker','sub','date','by'])document.getElementById(k).textContent=d[k]||'';
const h=document.getElementById('call'),c=(d.call||'').replace(/[.]\s*$/,'');h.textContent=c;const dot=document.createElement('span');dot.className='dot';dot.textContent='.';h.appendChild(dot);
const s={tall:{w:1080,h:1350,pad:88,gap:40,small:32,mid:40,big:124},wide:{w:1200,h:627,pad:56,gap:20,small:22,mid:26,big:66}}[p.get('size')||'tall'];
for(const[k,v]of Object.entries(s))document.documentElement.style.setProperty('--'+k,v+'px');
</script></body></html>
