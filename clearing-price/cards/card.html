<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SS4;src:url(fonts/source-serif-4-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:SS4;src:url(fonts/source-serif-4-latin-400-italic.woff2);font-style:italic;font-weight:400}
@font-face{font-family:SS3;src:url(fonts/source-sans-3-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:SS3;src:url(fonts/source-sans-3-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:SS3;src:url(fonts/source-sans-3-latin-700-normal.woff2);font-weight:700}
:root{--ink:#111;--paper:#f6f3ec;--accent:#e4572e;--muted:#3f3b34}
*{margin:0;box-sizing:border-box}
body{font-feature-settings:"kern" 1,"liga" 1;text-rendering:optimizeLegibility;font-variant-numeric:lining-nums;width:var(--w);height:var(--h);background:var(--paper);color:var(--ink);font-family:SS4,serif;display:flex;flex-direction:column;padding:var(--pad);gap:var(--gap);overflow:hidden}
.sans{font-family:SS3,"Helvetica Neue",Arial,sans-serif;font-feature-settings:"kern" 1,"liga" 1,"lnum" 1}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:var(--small);letter-spacing:.09em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:.6em}
.mark{font-family:SS4,serif;letter-spacing:0;background:var(--ink);color:var(--paper);width:2.4em;height:2.4em;display:flex;align-items:center;justify-content:center;font-size:1.05em;text-transform:none}
.mark i{font-style:normal;color:var(--accent)}
.top .stop{color:var(--accent)}
.top .issue{color:var(--muted);letter-spacing:.08em;font-variant-numeric:tabular-nums lining-nums}
.top .issue::before{content:"Called "}
.main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.kicker{font-weight:700;font-size:var(--small);color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:var(--kgap)}
h1{font-size:var(--big);line-height:var(--lh);font-weight:700;letter-spacing:var(--trk);text-wrap:balance;hyphens:none}
h1 .nb{white-space:nowrap}
h1 .dot{color:var(--accent)}
.sub{margin-top:var(--sgap);font-size:var(--mid);color:var(--muted);font-style:italic;line-height:1.34;max-width:var(--measure);text-wrap:balance;font-variant-numeric:oldstyle-nums proportional-nums;hyphens:none}
.clears{border-top:4px dashed var(--ink);padding-top:var(--gap);display:flex;gap:.6em 1.5em;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;font-weight:700;font-size:var(--small)}
/* price tag: notched left edge + punched hole, slight hang */
.tag{position:relative;background:var(--accent);color:var(--paper);padding:.45em .9em .5em 2.1em;transform:rotate(-2deg);transform-origin:left center;
 clip-path:polygon(1.1em 0,100% 0,100% 100%,1.1em 100%,0 50%);display:flex;flex-direction:column;line-height:1}
.tag::before{content:"";position:absolute;left:.85em;top:50%;width:.55em;height:.55em;margin-top:-.275em;border-radius:50%;background:var(--paper)}
.tag small{font-size:.62em;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.9;margin-bottom:.35em}
.tag b{white-space:nowrap;font-size:var(--tagsz);letter-spacing:-.005em;font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.url{font-size:.9em;text-align:right;line-height:1.35;white-space:nowrap;font-weight:400;color:var(--muted)}
.url b{font-weight:600;color:var(--ink)}
.url .sep{padding:0 .4em;color:var(--accent)}
</style></head><body>
<div class="top sans"><span class="brand"><span class="mark">CP<i>.</i></span>Clearing Price</span><span class="issue" id="issue"></span></div>
<div class="main"><div class="kicker sans" id="kicker"></div><h1 id="call"></h1><div class="sub" id="sub"></div></div>
<div class="clears sans"><span class="tag"><small>Settles by</small><b id="date"></b></span><span class="url" id="by"></span></div>
<script>
const p=new URLSearchParams(location.search);const d=JSON.parse(p.get('d'));
for(const k of ['issue','kicker','sub','date'])document.getElementById(k).textContent=d[k]||'';
const by=document.getElementById('by'),bp=(d.by||'').split(/\s*·\s*/);if(bp.length>1){const b=document.createElement('b');b.textContent=bp[0];by.append(b);const sp=document.createElement('span');sp.className='sep';sp.textContent='/';by.append(sp,bp.slice(1).join(' · '))}else by.textContent=d.by||'';
const h=document.getElementById('call'),c=(d.call||'').replace(/[.]\s*$/,'');c.split(/(\S*-\S*)/).forEach(t=>{if(!t)return;if(/-/.test(t)){const n=document.createElement('span');n.className='nb';n.textContent=t;h.append(n)}else h.append(t)});const dot=document.createElement('span');dot.className='dot';dot.textContent='.';h.appendChild(dot);
const s={tall:{w:1080,h:1350,pad:88,gap:40,small:30,mid:40,big:132,tagsz:76,kgap:22,sgap:36,measure:820},wide:{w:1200,h:627,pad:56,gap:20,small:21,mid:26,big:70,tagsz:50,kgap:14,sgap:18,measure:1088}}[p.get('size')||'tall'];
for(const[k,v]of Object.entries(s))document.documentElement.style.setProperty('--'+k,v+'px');
const n=(d.call||'').length,steps=p.get('size')==='wide'?[70,60,52]:[132,112,96];
s.big=n<=40?steps[0]:n<=70?steps[1]:steps[2];
for(const[k,v]of Object.entries(s))document.documentElement.style.setProperty('--'+k,v+'px');
const R=document.documentElement.style;R.setProperty('--lh',p.get('size')==='wide'?'1.06':'1.0');R.setProperty('--trk',p.get('size')==='wide'?'-.012em':'-.022em');
const fit=()=>{const M=document.querySelector('.main');let g=0;while(M.scrollHeight>M.clientHeight+1&&s.big>40&&g++<30){s.big-=4;R.setProperty('--big',s.big+'px')}document.body.dataset.fit='1'};fit();document.fonts.ready.then(fit);
</script></body></html>
